# 初回オンボーディングを再表示しない
onboarding = false

[keys]
# --- 基本 ---
# prefix キーを Ctrl+w にする
prefix = "ctrl+w"
# デタッチする
detach = "prefix+d"

# --- pane ---
# pane を左右に分割する(右へ)
split_vertical = "prefix+|"
# pane を上下に分割する(下へ)
split_horizontal = "prefix+minus"
# pane を閉じる
close_pane = "prefix+x"

# --- カスタムコマンド ---
# gcloud auth login を一時 pane で実行する(gcloud が無ければ即終了して pane も閉じる)
[[keys.command]]
key = "prefix+i"
type = "pane"
command = "sh -c 'command -v gcloud >/dev/null 2>&1 && exec gcloud auth login'"

# --- UI ---
[ui]
status_indicators = "dots"
# マウス(既定値と同じだが明示)
# herdr がマウス入力を受け付ける
mouse_capture = true
# マウス選択したテキストを自動コピーする
copy_on_select = true
# ホイール 1 ノッチあたりのスクロール行数
mouse_scroll_lines = 3

# --- セッション ---
[session]
resume_agents_on_restore = true

# --- 日本語 IME 対策(experimental) ---
[experimental]
# prefix 入力中だけ ASCII 入力に切り替え、IME 有効時でも prefix コマンドを効かせる
switch_ascii_input_source_in_prefix = true
# Claude Code など独自カーソルを描く TUI で、IME 候補ウィンドウがカーソルに追従するようにする
reveal_hidden_cursor_for_cjk_ime = true
# 上記を claude の pane のみに適用(vim のノーマルモード等への副作用を避ける)
cjk_ime_agents = ["claude"]

# --- サイドバー ---
# space 行: 1行目=状態/workspace、2行目=branch/git 状態
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# エージェント行: 1行目=状態/workspace/tab、2行目=端末タイトル
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "workspace", fg = "#89b4fa", bold = true }, "tab"],
  ["terminal_title_stripped"],
]

[theme]
name = "one-dark"
auto_switch = false
